<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Sweet Drop Riches Prototype</title>
    <script>
      (() => {
        try {
          if (new URLSearchParams(window.location.search).has("perf")) {
            document.documentElement.classList.add("ios-performance");
          }
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=energy-safe-target-20260615-005822" />
  </head>
  <body>
    <main class="stage">
      <div id="cabinetScale" class="cabinet-scale">
        <div class="cabinet-transform">
      <section class="phone" aria-label="Sweet Drop Riches prototype">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <header class="topbar">
          <div class="brand" aria-label="Sweet Drop Riches">
            <img class="brand-logo" src="assets/ui/mobile/logo-sweet-drop-riches-mobile.png?v=mobile-assets-20260611-195335" alt="Sweet Drop Riches" />
          </div>
        </header>

        <div class="climax-stage" id="climaxStage" aria-hidden="true">
          <div class="climax-wheel-view">
            <div class="climax-wheel-rotor" id="climaxWheelRotor">
              <div class="climax-wheel-highlight" id="climaxWheelHighlight"></div>
              <img id="climaxWheelImage" data-src="assets/ui/mobile/climax-wheel-disc-mobile.png?v=wheel-lite-20260613-050918" alt="" />
              <div class="climax-wheel-labels" id="climaxWheelLabels"></div>
            </div>
          </div>
          <div class="climax-charge-targets" id="climaxChargeTargets" aria-hidden="true">
            <i class="climax-charge-target" data-slot="0"></i>
            <i class="climax-charge-target" data-slot="1"></i>
            <i class="climax-charge-target" data-slot="2"></i>
          </div>
          <div class="climax-center-line" id="climaxCenterLine" aria-hidden="true"></div>
        </div>

        <div class="play-area">
          <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>
          <div class="board-shell">
            <div class="board-bar">
              <div class="special-meter" aria-label="三階段事件進度">
                <div class="special-meter-copy">
                  <span>事件收集</span>
                  <strong id="specialMeterText">0/40</strong>
                </div>
                <div class="special-meter-track">
                  <i id="specialMeterFill"></i>
                  <span class="meter-mark meter-mark-1">9</span>
                  <span class="meter-mark meter-mark-2">21</span>
                  <span class="meter-mark meter-mark-3">40</span>
                </div>
                <div class="energy-hole-guides" aria-hidden="true">
                  <i class="energy-hole-guide energy-hole-guide-1"></i>
                  <i class="energy-hole-guide energy-hole-guide-2"></i>
                  <i class="energy-hole-guide energy-hole-guide-3"></i>
                </div>
                <div class="stage-slots" id="stageSlots" aria-label="三階段事件預覽">
                  <div class="event-socket active" id="specialMiniSlot" data-stage="1" aria-label="第一階段事件預覽">
                    <img id="miniSlotIcon" src="assets/symbols/candy-purple.png?v=normal-candy-scale-20260611-225819" alt="" />
                  </div>
                  <div class="event-socket" data-stage="2" aria-label="第二階段事件預覽">
                    <img src="assets/symbols/candy-blue.png?v=normal-candy-scale-20260611-225819" alt="" />
                  </div>
                  <div class="event-socket jackpot-stage" data-stage="3" aria-label="第三階段事件預覽">
                    <img src="assets/symbols/multiplier-relic-x50.png?v=symbol-rules-70-no-deadlock-rescue" alt="" />
                  </div>
                </div>
              </div>
            </div>

            <div id="board" class="board" aria-label="6x9 糖果盤面"></div>

            <div class="drop-arrows" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>

            <div id="slots" class="slots" aria-label="3 個倍數收集槽"></div>
          </div>

          <div id="winOverlay" class="win-overlay hidden" aria-live="polite">
            <div class="win-backdrop"></div>
            <div class="win-rays"></div>
            <div class="win-coins" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="win-copy">
              <i class="win-crown"></i>
              <em>本步總贏分</em>
              <img id="winTitleArt" class="win-title-art" alt="MEGA WIN" loading="lazy" decoding="async" />
              <b id="winAmount">0.00</b>
              <span id="winLabel">MEGA WIN</span>
              <strong id="winMultiplier">20x</strong>
            </div>
          </div>

          <div id="statusText" class="status-text">清出通道，追高倍糖果</div>
          <div id="perfPanel" class="perf-panel hidden" aria-hidden="true"></div>
        </div>

        <footer class="hud">
          <div class="hud-panel">
            <span>BALANCE</span>
            <strong id="balance">10,000.00</strong>
          </div>
          <div class="bet-panel">
            <button id="betDown" type="button" title="降低 Bet" aria-label="降低 Bet">−</button>
            <div>
              <span>BET</span>
              <strong id="bet">100</strong>
            </div>
            <button id="betUp" type="button" title="提高 Bet" aria-label="提高 Bet">+</button>
          </div>
          <button
            class="icon-button"
            id="fastButton"
            type="button"
            title="切換快速解析"
            aria-label="切換快速解析"
            aria-pressed="false"
          >
            ▶▶
          </button>
          <button class="icon-button" id="menuButton" type="button" title="選單" aria-label="選單">
            ☰
          </button>
        </footer>

        <div id="menuPanel" class="menu-panel hidden" role="dialog" aria-label="選單">
          <div class="menu-head">
            <strong>Sweet Drop Riches</strong>
            <button id="closeMenu" type="button" aria-label="關閉">×</button>
          </div>
          <button id="soundMenuButton" type="button">音效開啟</button>
          <button id="specialOddsButton" type="button">特殊機率關閉</button>
        </div>
      </section>
        </div>
      </div>
    </main>

    <script src="script.js?v=energy-safe-target-20260615-005822"></script>
  </body>
</html>
